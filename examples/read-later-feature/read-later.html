<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Later - BrowserX</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      color: #333;
    }

    .stats {
      font-size: 14px;
      color: #666;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      background: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .search-box {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
    }

    .articles-list {
      display: grid;
      gap: 15px;
    }

    .article-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: all 0.3s;
      position: relative;
    }

    .article-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .article-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .article-title a {
      color: #333;
      text-decoration: none;
    }

    .article-title a:hover {
      color: #667eea;
    }

    .article-meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .article-description {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .article-url {
      font-size: 12px;
      color: #999;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #e53e3e;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #c53030;
    }

    .empty-state {
      background: white;
      padding: 60px 40px;
      border-radius: 12px;
      text-align: center;
      color: #666;
    }

    .empty-state h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>📖 Read Later</h1>
        <div class="stats">
          <span id="count">0 articles saved</span>
        </div>
      </div>
    </header>

    <div class="actions">
      <input type="text" class="search-box" id="search" placeholder="🔍 Search articles...">
      <button onclick="exportList()">⬇️ Export</button>
      <button onclick="importList()">⬆️ Import</button>
      <button onclick="clearAll()">🗑️ Clear All</button>
    </div>

    <div id="articles-container" class="articles-list"></div>
  </div>

  <script>
    // Load and display articles
    function loadArticles(searchQuery = '') {
      const readLater = JSON.parse(localStorage.getItem('readLater') || '[]');
      const container = document.getElementById('articles-container');
      const countEl = document.getElementById('count');
      
      // Filter by search query
      const filtered = searchQuery 
        ? readLater.filter(item => 
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.url.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (item.description && item.description.toLowerCase().includes(searchQuery.toLowerCase()))
          )
        : readLater;
      
      countEl.textContent = `${filtered.length} article${filtered.length !== 1 ? 's' : ''} saved`;
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>No articles saved yet</h2>
            <p>Start browsing and click the 📖 button to save articles!</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = filtered.map((item, index) => `
        <div class="article-card" data-url="${item.url}">
          <button class="delete-btn" onclick="deleteArticle('${item.url}')">✕ Delete</button>
          <div class="article-title">
            <a href="${item.url}" target="_blank">${item.title}</a>
          </div>
          <div class="article-meta">
            💾 Saved ${formatDate(item.savedAt)}
          </div>
          ${item.description ? `
            <div class="article-description">
              ${item.description.substring(0, 200)}${item.description.length > 200 ? '...' : ''}
            </div>
          ` : ''}
          <div class="article-url">${item.url}</div>
        </div>
      `).join('');
    }

    // Format date
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      
      if (diffMins < 60) return `${diffMins} minute${diffMins !== 1 ? 's' : ''} ago`;
      if (diffHours < 24) return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
      if (diffDays < 7) return `${diffDays} day${diffDays !== 1 ? 's' : ''} ago`;
      
      return date.toLocaleDateString();
    }

    // Delete article
    function deleteArticle(url) {
      if (!confirm('Remove this article from Read Later?')) return;
      
      let readLater = JSON.parse(localStorage.getItem('readLater') || '[]');
      readLater = readLater.filter(item => item.url !== url);
      localStorage.setItem('readLater', JSON.stringify(readLater));
      
      loadArticles(document.getElementById('search').value);
    }

    // Export list as JSON
    function exportList() {
      const readLater = JSON.parse(localStorage.getItem('readLater') || '[]');
      const json = JSON.stringify(readLater, null, 2);
      
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reading-list-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      
      alert('Reading list exported!');
    }

    // Import list from JSON
    function importList() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            const current = JSON.parse(localStorage.getItem('readLater') || '[]');
            
            // Merge and deduplicate by URL
            const merged = [...current];
            imported.forEach(item => {
              if (!merged.some(m => m.url === item.url)) {
                merged.push(item);
              }
            });
            
            localStorage.setItem('readLater', JSON.stringify(merged));
            loadArticles();
            alert(`Imported ${imported.length} articles!`);
          } catch (error) {
            alert('Invalid JSON file');
          }
        };
        
        reader.readAsText(file);
      });
      
      input.click();
    }

    // Clear all articles
    function clearAll() {
      if (!confirm('Delete all saved articles? This cannot be undone.')) return;
      
      localStorage.removeItem('readLater');
      loadArticles();
    }

    // Search functionality
    document.getElementById('search').addEventListener('input', (e) => {
      loadArticles(e.target.value);
    });

    // Initial load
    loadArticles();

    // Listen for storage changes (sync across tabs)
    window.addEventListener('storage', (e) => {
      if (e.key === 'readLater') {
        loadArticles(document.getElementById('search').value);
      }
    });
  </script>
</body>
</html>
