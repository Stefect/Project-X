<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowserX - Завантаження</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #1a1b26 0%, #24283b 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-app-region: drag; 
            overflow: hidden;
            position: relative;
        }

        
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(59, 130, 246, 0.5);
            border-radius: 50%;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 1; }
        }

        
        .splash-content {
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 2s infinite alternate;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
            animation: pulse 2s infinite alternate;
        }

        
        @keyframes pulse {
            0% { 
                transform: scale(0.95); 
                filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3));
            }
            100% { 
                transform: scale(1.05); 
                filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.6));
            }
        }

        
        .loading-text {
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        
        .spinner {
            width: 50px;
            height: 50px;
            margin: 20px auto;
            position: relative;
        }

        .spinner::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        
        .progress-container {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 30px auto 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            animation: loading 2s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        
        .version {
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: #6b7280;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    
    <div class="particles" id="particles"></div>

    
    <div class="splash-content">
        <div class="logo">
            <img src="../build/icon.ico" alt="BrowserX" class="logo-icon">
            <span>BrowserX</span>
        </div>
        <div class="spinner"></div>
        <div class="loading-text">Ініціалізація систем...</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="version">v1.0.0</div>

    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 3 + 's';
            particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
            particlesContainer.appendChild(particle);
        }
        const loadingTexts = [
            'Ініціалізація систем...',
            'Завантаження Tor...',
            'Підготовка інтерфейсу...',
            'Майже готово...'
        ];
        let currentTextIndex = 0;
        
        setInterval(() => {
            currentTextIndex = (currentTextIndex + 1) % loadingTexts.length;
            document.querySelector('.loading-text').textContent = loadingTexts[currentTextIndex];
        }, 1500);
    </script>
</body>
</html>
