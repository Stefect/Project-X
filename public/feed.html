<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌊 AI News Feed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: transparent;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Вертикальний сайдбар справа */
        .news-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 350px;
            height: 100vh;
            background: rgba(30, 31, 42, 0.85);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        /* Заголовок News */
        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-close-feed {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            line-height: 1;
            flex-shrink: 0;
        }

        .btn-close-feed:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .sidebar-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Контейнер для стрічки */
        #feed-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            scroll-behavior: smooth;
        }

        #feed-container::-webkit-scrollbar {
            width: 6px;
        }

        #feed-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #feed-container::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 10px;
        }

        #feed-container::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.8);
        }

        /* Картка новини (хвиляста) */
        .feed-item {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            animation: slideInRight 0.3s ease;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .feed-item:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-color: rgba(102, 126, 234, 0.6);
            transform: translateX(-5px);
        }

        /* Хвилястий ефект */
        .feed-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .feed-source {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .feed-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .feed-summary {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Кнопки управління внизу */
        .sidebar-controls {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .control-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .feed-skip {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid rgba(255, 152, 0, 0.3);
            color: #ff9800;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 11px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .empty-state-text {
            font-size: 14px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Лічильник */
        .stats-badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Панель категорій */
        .categories-panel {
            position: fixed;
            right: 350px;
            top: 0;
            width: 250px;
            height: 100vh;
            background: rgba(20, 21, 32, 0.75);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
        }

        .categories-panel.active {
            transform: translateX(0);
        }

        .categories-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .categories-title {
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }

        .categories-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .categories-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .category-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-item:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateX(5px);
        }

        .category-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
            border-color: rgba(102, 126, 234, 0.6);
        }

        .category-name {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }

        .category-check {
            font-size: 16px;
            color: #667eea;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .category-item.active .category-check {
            opacity: 1;
        }

        .categories-footer {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(20, 21, 32, 0.5);
        }

        .categories-save-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .categories-save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .categories-save-btn:active {
            transform: translateY(0);
        }

        .btn-categories {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid rgba(255, 152, 0, 0.3);
            color: #ff9800;
        }

        .btn-categories:hover {
            background: rgba(255, 152, 0, 0.2);
            border-color: rgba(255, 152, 0, 0.5);
            transform: translateY(-2px);
        }

        /* Панель джерел (sources filter) */
        .sources-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: rgba(20, 21, 32, 0.75);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 49;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
        }

        .sources-panel.active {
            transform: translateX(0);
        }

        .source-item {
            padding: 10px 15px;
            margin-bottom: 6px;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .source-item:hover {
            background: rgba(76, 175, 80, 0.2);
            border-color: rgba(76, 175, 80, 0.4);
            transform: translateX(5px);
        }

        .source-item.active {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.3) 0%, rgba(56, 142, 60, 0.3) 100%);
            border-color: rgba(76, 175, 80, 0.6);
        }

        .source-badge {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .btn-sources {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .btn-sources:hover {
            background: rgba(76, 175, 80, 0.2);
            border-color: rgba(76, 175, 80, 0.5);
            transform: translateY(-2px);
        }

        .sources-search {
            padding: 10px 15px;
            margin: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .sources-search:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(76, 175, 80, 0.5);
        }

        .sources-search::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <!-- Панель категорій (окремо від sidebar) -->
    <div class="categories-panel" id="categories-panel">
        <div class="categories-header">
            <div class="categories-title">Категорії</div>
            <div class="categories-subtitle">Обери теми (можна декілька)</div>
        </div>
        <div class="categories-list">
            <div class="category-item active" data-category="all">
                <span class="category-name">Всі</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="tech">
                <span class="category-name">Технології</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="programming">
                <span class="category-name">Програмування</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="ai">
                <span class="category-name">Штучний інтелект</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="science">
                <span class="category-name">Наука</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="news">
                <span class="category-name">Новини світу</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="ukraine">
                <span class="category-name">Україна</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="gaming">
                <span class="category-name">Ігри</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="crypto">
                <span class="category-name">Криптовалюта</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="business">
                <span class="category-name">Бізнес</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="entertainment">
                <span class="category-name">Розваги</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="sports">
                <span class="category-name">Спорт</span>
                <span class="category-check">✓</span>
            </div>
            <div class="category-item" data-category="health">
                <span class="category-name">Здоров'я</span>
                <span class="category-check">✓</span>
            </div>
        </div>
        <div class="categories-footer">
            <button id="categories-save-btn" class="categories-save-btn">
                Зберегти
            </button>
        </div>
    </div>

    <!-- Панель джерел (фільтр джерел новин) -->
    <div class="sources-panel" id="sources-panel">
        <div class="categories-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div class="categories-title">Джерела</div>
                    <div class="categories-subtitle">Фільтруй звідки брати новини</div>
                </div>
                <button id="btn-close-sources" style="background: transparent; border: none; color: rgba(255, 255, 255, 0.6); font-size: 28px; cursor: pointer; padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;" title="Закрити">×</button>
            </div>
        </div>
        <input type="text" id="sources-search" class="sources-search" placeholder="Пошук джерел...">
        <div class="categories-list" id="sources-list">
            <!-- Джерела будуть додані динамічно через JS -->
        </div>
        <div class="categories-footer">
            <button id="sources-save-btn" class="categories-save-btn">
                Зберегти
            </button>
        </div>
    </div>

    <!-- Вертикальний сайдбар справа -->
    <div class="news-sidebar">

        <!-- Заголовок -->
        <div class="sidebar-header">
            <div>
                <div class="sidebar-title">News</div>
                <div class="sidebar-subtitle">
                    AI Feed <span class="stats-badge" id="stats">0 articles</span>
                </div>
            </div>
            <button id="btn-close-feed" class="btn-close-feed" title="Закрити панель">×</button>
        </div>

        <!-- Стрічка новин -->
        <div id="feed-container">
            <div class="empty-state">
                <div class="empty-state-icon">Новини</div>
                <div class="empty-state-text">
                    Натисни кнопку внизу<br>щоб запустити стрічку
                </div>
            </div>
        </div>

        <!-- Кнопки управління -->
        <div class="sidebar-controls">
            <button id="btn-sources" class="control-btn btn-sources">
                Джерела
            </button>
            <button id="btn-categories" class="control-btn btn-categories">
                Категорії
            </button>
            <button id="btn-start" class="control-btn btn-start">
                Start
            </button>
            <button id="btn-stop" class="control-btn btn-stop" style="display: none;">
                Stop
            </button>
        </div>
    </div>

    <script>
        // Визначаємо API - якщо в iframe, використовуємо parent API
        const api = (window.parent && window.parent !== window && window.parent.api) ? window.parent.api : window.api;
        
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnCategories = document.getElementById('btn-categories');
        const btnSources = document.getElementById('btn-sources');
        const btnCloseFeed = document.getElementById('btn-close-feed');
        const categoriesPanel = document.getElementById('categories-panel');
        const sourcesPanel = document.getElementById('sources-panel');
        const sourcesList = document.getElementById('sources-list');
        const sourcesSearch = document.getElementById('sources-search');
        const container = document.getElementById('feed-container');
        const stats = document.getElementById('stats');
        let feedActive = false;
        let articlesLoaded = 0;
        let selectedCategories = ['all']; // Масив обраних категорій
        let selectedSources = []; // Масив обраних джерел (якщо порожній - всі)

        // Обробник кнопки закриття панелі
        if (btnCloseFeed) {
            btnCloseFeed.addEventListener('click', () => {
                // Якщо в iframe, закриваємо overlay в parent
                if (window.parent && window.parent !== window) {
                    const feedOverlay = window.parent.document.getElementById('feed-overlay');
                    if (feedOverlay) {
                        feedOverlay.style.display = 'none';
                    }
                } else {
                    // Якщо автономно, повертаємося на newtab
                    window.location.href = 'newtab.html';
                }
            });
        }

        // Функція для оновлення статистики
        function updateStats() {
            stats.textContent = `${articlesLoaded} articles`;
        }

        // Функція для отримання обраних категорій
        function getSelectedCategories() {
            const activeItems = document.querySelectorAll('.category-item.active');
            const categories = Array.from(activeItems).map(item => item.getAttribute('data-category'));
            
            // Якщо обрано "Всі", повертаємо тільки 'all'
            if (categories.includes('all')) {
                return ['all'];
            }
            
            // Якщо нічого не обрано, повертаємо 'all'
            if (categories.length === 0) {
                return ['all'];
            }
            
            return categories;
        }

        // Обробник кнопки категорій
        btnCategories.addEventListener('click', () => {
            categoriesPanel.classList.toggle('active');
            // Закриваємо панель джерел якщо вона відкрита
            if (sourcesPanel) {
                sourcesPanel.classList.remove('active');
            }
        });

        // Закриття панелей при натисканні ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (categoriesPanel && categoriesPanel.classList.contains('active')) {
                    categoriesPanel.classList.remove('active');
                }
                if (sourcesPanel && sourcesPanel.classList.contains('active')) {
                    sourcesPanel.classList.remove('active');
                }
            }
        });

        // Обробник вибору категорій (множинний вибір)
        document.querySelectorAll('.category-item').forEach(item => {
            item.addEventListener('click', () => {
                const category = item.getAttribute('data-category');
                
                if (category === 'all') {
                    // Якщо натиснули "Всі" - знімаємо всі інші та активуємо тільки "Всі"
                    document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                } else {
                    // Знімаємо "Всі" якщо воно було активне
                    const allItem = document.querySelector('.category-item[data-category="all"]');
                    if (allItem) {
                        allItem.classList.remove('active');
                    }
                    
                    // Перемикаємо активний стан для обраної категорії
                    item.classList.toggle('active');
                    
                    // Якщо нічого не обрано, автоматично активуємо "Всі"
                    const activeCount = document.querySelectorAll('.category-item.active').length;
                    if (activeCount === 0 && allItem) {
                        allItem.classList.add('active');
                    }
                }
                
                console.log('Вибрано категорії (не збережено)');
            });
        });

        // Обробник кнопки "Зберегти" в панелі категорій
        const categoriesSaveBtn = document.getElementById('categories-save-btn');
        if (categoriesSaveBtn) {
            categoriesSaveBtn.addEventListener('click', async () => {
                selectedCategories = getSelectedCategories();
                console.log('Збережено категорії:', selectedCategories);
                
                // Закриваємо панель категорій
                categoriesPanel.classList.remove('active');
                
                // Якщо стрічка активна, перезапускаємо її з новими категоріями
                if (feedActive && api) {
                    await api.stopFeed();
                    container.innerHTML = '<div class="loading">Завантаження новин...</div>';
                    articlesLoaded = 0;
                    updateStats();
                    
                    setTimeout(async () => {
                        await api.startFeed(selectedCategories, selectedSources);
                        feedActive = true;
                    }, 500);
                }
            });
        }

        // === ДЖЕРЕЛА (SOURCES) ===
        
        // Список всіх доступних джерел (синхронізовано з ai-feed.js)
        const ALL_SOURCES = [
            { name: 'Reddit Tech', type: 'reddit' },
            { name: 'Reddit Programming', type: 'reddit' },
            { name: 'Dev.to', type: 'devto' },
            { name: 'Hacker News', type: 'hackernews' },
            { name: 'Reddit Science', type: 'reddit' },
            { name: 'Reddit Space', type: 'reddit' },
            { name: 'Reddit Physics', type: 'reddit' },
            { name: 'Reddit World News', type: 'reddit' },
            { name: 'Reddit News', type: 'reddit' },
            { name: 'Reddit Gaming', type: 'reddit' },
            { name: 'Reddit PC Gaming', type: 'reddit' },
            { name: 'Reddit Games', type: 'reddit' },
            { name: 'Reddit Machine Learning', type: 'reddit' },
            { name: 'Reddit Artificial', type: 'reddit' },
            { name: 'Reddit Local LLaMA', type: 'reddit' },
            { name: 'Reddit Crypto', type: 'reddit' },
            { name: 'Reddit Bitcoin', type: 'reddit' },
            { name: 'Reddit Ethereum', type: 'reddit' },
            { name: 'Reddit Business', type: 'reddit' },
            { name: 'Reddit Economics', type: 'reddit' },
            { name: 'Reddit Entrepreneur', type: 'reddit' },
            { name: 'Reddit Ukraine', type: 'reddit' },
            { name: 'Reddit Ukraine Conflict', type: 'reddit' },
            { name: 'Suspilne News', type: 'rss2json' },
            { name: 'Ukrainska Pravda', type: 'rss2json' },
            { name: 'Kyiv Independent', type: 'rss2json' },
            { name: 'Reddit Movies', type: 'reddit' },
            { name: 'Reddit Music', type: 'reddit' },
            { name: 'Reddit Television', type: 'reddit' },
            { name: 'Reddit Sports', type: 'reddit' },
            { name: 'Reddit Soccer', type: 'reddit' },
            { name: 'Reddit NBA', type: 'reddit' },
            { name: 'Reddit Health', type: 'reddit' },
            { name: 'Reddit Fitness', type: 'reddit' },
            { name: 'Reddit Nutrition', type: 'reddit' }
        ];

        // Функція для рендерингу списку джерел
        function renderSources(filter = '') {
            sourcesList.innerHTML = '';
            const filteredSources = ALL_SOURCES.filter(source => 
                source.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            filteredSources.forEach(source => {
                const item = document.createElement('div');
                item.className = 'source-item';
                if (selectedSources.length === 0 || selectedSources.includes(source.name)) {
                    item.classList.add('active');
                }
                item.setAttribute('data-source', source.name);
                
                const typeLabel = source.type === 'reddit' ? '[R]' : 
                                 source.type === 'devto' ? '[D]' : 
                                 source.type === 'hackernews' ? '[HN]' : 
                                 source.type === 'rss2json' ? '[UA]' : '[?]';
                
                item.innerHTML = `
                    <span style="font-size: 11px; color: rgba(255,255,255,0.5);">${typeLabel}</span>
                    <span class="category-name" style="flex: 1; font-size: 12px;">${source.name}</span>
                    <span class="category-check">✓</span>
                `;
                
                item.addEventListener('click', () => {
                    item.classList.toggle('active');
                    console.log('Вибрано джерело (не збережено)');
                });
                
                sourcesList.appendChild(item);
            });
        }

        // Початковий рендеринг джерел
        renderSources();

        // Пошук джерел
        if (sourcesSearch) {
            sourcesSearch.addEventListener('input', (e) => {
                renderSources(e.target.value);
            });
        }

        // Обробник кнопки джерел
        if (btnSources) {
            btnSources.addEventListener('click', () => {
                sourcesPanel.classList.toggle('active');
                // Закриваємо панель категорій якщо вона відкрита
                if (categoriesPanel) {
                    categoriesPanel.classList.remove('active');
                }
            });
        }

        // Обробник кнопки "Зберегти" в панелі джерел
        const sourcesSaveBtn = document.getElementById('sources-save-btn');
        if (sourcesSaveBtn) {
            sourcesSaveBtn.addEventListener('click', async () => {
                const activeSourceItems = document.querySelectorAll('.source-item.active');
                selectedSources = Array.from(activeSourceItems).map(item => item.getAttribute('data-source'));
                
                console.log('Збережено джерела (кількість):', selectedSources.length);
                console.log('Збережено джерела (список):', selectedSources);
                
                // Закриваємо панель джерел
                sourcesPanel.classList.remove('active');
                
                // Якщо стрічка активна, перезапускаємо її з новими джерелами
                if (feedActive && api) {
                    await api.stopFeed();
                    container.innerHTML = '<div class="loading">Завантаження новин...</div>';
                    articlesLoaded = 0;
                    updateStats();
                    
                    setTimeout(async () => {
                        await api.startFeed(selectedCategories, selectedSources);
                        feedActive = true;
                    }, 500);
                }
            });
        }

        // === КІНЕЦЬ ДЖЕРЕЛ ===

        // Кнопка закриття панелі джерел
        const btnCloseSources = document.getElementById('btn-close-sources');
        if (btnCloseSources) {
            btnCloseSources.addEventListener('click', () => {
                sourcesPanel.classList.remove('active');
            });
            btnCloseSources.addEventListener('mouseenter', (e) => {
                e.target.style.color = '#fff';
                e.target.style.transform = 'rotate(90deg)';
            });
            btnCloseSources.addEventListener('mouseleave', (e) => {
                e.target.style.color = 'rgba(255, 255, 255, 0.6)';
                e.target.style.transform = 'rotate(0deg)';
            });
        }

        // Закриття панелей на ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (categoriesPanel) categoriesPanel.classList.remove('active');
                if (sourcesPanel) sourcesPanel.classList.remove('active');
            }
        });

        // Закриття панелей при кліку поза ними
        document.addEventListener('click', (e) => {
            if (categoriesPanel && categoriesPanel.classList.contains('active')) {
                if (!categoriesPanel.contains(e.target) && !btnCategories.contains(e.target)) {
                    categoriesPanel.classList.remove('active');
                }
            }
            if (sourcesPanel && sourcesPanel.classList.contains('active')) {
                if (!sourcesPanel.contains(e.target) && !btnSources.contains(e.target)) {
                    sourcesPanel.classList.remove('active');
                }
            }
        });

        // Обробник кнопки Start
        btnStart.addEventListener('click', async () => {
            if (!api) {
                console.error('API not available');
                alert('❌ API не доступне! Перезавантажте сторінку.');
                return;
            }
            
            console.log('Запуск стрічки...');
            console.log('Категорії:', selectedCategories);
            console.log('Джерела:', selectedSources.length > 0 ? `${selectedSources.length} обрано` : 'Всі (за замовчуванням)');
            
            try {
                const result = await api.startFeed(selectedCategories, selectedSources);
                console.log('✅ Feed started:', result);
                
                btnStart.style.display = 'none';
                btnStop.style.display = 'flex';
                feedActive = true;

                // Очищуємо контейнер при першому запуску
                if (articlesLoaded === 0) {
                    container.innerHTML = '<div class="loading">Завантаження новин...</div>';
                }
            } catch (error) {
                console.error('❌ Помилка запуску:', error);
                alert('❌ Помилка запуску стрічки: ' + error.message);
            }
        });

        // Обробник кнопки Stop
        btnStop.addEventListener('click', async () => {
            if (!api) {
                console.error('API not available');
                return;
            }
            const result = await api.stopFeed();
            console.log('Feed stopped:', result);
            
            btnStop.style.display = 'none';
            btnStart.style.display = 'flex';
            feedActive = false;
        });

        // Коли приходить нова оброблена стаття
        if (api && api.onNewFeedItem) {
            api.onNewFeedItem((article) => {
            console.log('New article received:', article);
            
            // Видаляємо повідомлення про порожній стан
            const emptyState = container.querySelector('.empty-state');
            const loading = container.querySelector('.loading');
            if (emptyState) emptyState.remove();
            if (loading) loading.remove();

            articlesLoaded++;
            updateStats();

            const card = document.createElement('div');
            card.className = 'feed-item';
            
            card.innerHTML = `
                <div class="feed-source">[${escapeHtml(article.source)}]</div>
                <div class="feed-title">${escapeHtml(article.title)}</div>
                <div class="feed-summary">${escapeHtml(article.summary)}</div>
            `;
            
            // Обробник кліку на картку
            card.addEventListener('click', async (e) => {
                e.preventDefault();
                // Відкриваємо у власному браузері
                if (api && api.openInBrowser) {
                    await api.openInBrowser(article.url);
                }
            });
            
            // Додаємо на початок стрічки (найновіше зверху)
            container.prepend(card);
        });
        }

        // Коли ШІ не встиг і ми пропустили статтю
        if (api && api.onFeedSkip) {
            api.onFeedSkip((source) => {
            console.log('Article skipped from:', source);
            
            const notice = document.createElement('div');
            notice.className = 'feed-skip';
            notice.textContent = `[TIMEOUT] Skipped from ${source}`;
            
            container.prepend(notice);

            // Автоматично видаляємо через 3 секунди
            setTimeout(() => {
                notice.style.transition = 'opacity 0.3s ease';
                notice.style.opacity = '0';
                setTimeout(() => notice.remove(), 300);
            }, 3000);
        });
        }

        // Функція для екранування HTML (безпека)
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        console.log('AI News Feed initialized!');
    </script>
</body>
</html>
