<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нова вкладка</title>
  <link rel="stylesheet" href="css/output.css">
</head>
<body class="dark-mode newtab-page">
  <div class="container">
    <div class="greeting" id="greeting">Привіт!</div>
    
    <div class="time-widget">
      <div class="time" id="time">00:00</div>
      <div class="date" id="date"></div>
    </div>

    <div class="logo">BrowserX</div>

    <!-- Speed Dial Section -->
    <div class="max-w-6xl mx-auto mt-10">
      <div id="speed-dial" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
        <!-- Speed Dial cards will be dynamically inserted here -->
      </div>
    </div>
  </div>

  <!-- Speed Dial Edit Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
    <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl w-full max-w-md shadow-2xl">
      <h2 id="modal-title" class="text-2xl font-bold mb-5 text-gray-100">Додати закладку</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">Назва сайту</label>
          <input type="text" id="link-title" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500" placeholder="Наприклад: YouTube">
        </div>
        
        <div>
          <label class="block text-sm text-gray-400 mb-1">URL адреса</label>
          <input type="url" id="link-url" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-indigo-500" placeholder="https://youtube.com">
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Іконка або Логотип</label>
          <div class="flex items-start gap-3">
            <div class="flex-1">
              <div class="flex gap-2 mb-2">
                <input type="text" id="link-icon" maxlength="2" class="w-16 bg-gray-900 border border-gray-600 rounded px-3 py-2 text-center text-xl text-white focus:outline-none focus:border-indigo-500" placeholder="▶️">
                <button type="button" id="fetch-logo-btn" class="px-3 py-2 rounded bg-blue-600 hover:bg-blue-500 text-white text-sm transition-colors flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  Завантажити логотип
                </button>
              </div>
              <p class="text-xs text-gray-500">Емодзі, літери або завантажте логотип сайту</p>
            </div>
            <div id="logo-preview" class="w-16 h-16 rounded-lg bg-gray-900 border border-gray-600 hidden items-center justify-center overflow-hidden">
              <img id="logo-preview-img" class="w-full h-full object-contain" alt="Preview">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-400 mb-2">Колір фону</label>
          <div id="color-picker" class="flex gap-3">
            <!-- Color buttons will be dynamically inserted here -->
          </div>
        </div>
      </div>

      <div class="mt-8 flex justify-end gap-3">
        <button id="cancel-modal-btn" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 text-white transition-colors">Скасувати</button>
        <button id="save-link-btn" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-white transition-colors">Зберегти</button>
      </div>
    </div>
  </div>

  <script>
    // Оновлення часу
    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time').textContent = `${hours}:${minutes}`;
      
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('uk-UA', options);
    }
    
    updateTime();
    setInterval(updateTime, 1000);

    // Привітання залежно від часу доби
    function updateGreeting() {
      const hour = new Date().getHours();
      let greeting;
      
      if (hour >= 5 && hour < 12) {
        greeting = 'Доброго ранку!';
      } else if (hour >= 12 && hour < 18) {
        greeting = 'Доброго дня!';
      } else if (hour >= 18 && hour < 22) {
        greeting = 'Доброго вечора!';
      } else {
        greeting = 'Доброї ночі!';
      }
      
      document.getElementById('greeting').textContent = greeting;
    }
    
    updateGreeting();

    // Завантаження налаштувань теми
    function loadTheme() {
      const mode = localStorage.getItem('themeMode') || 'dark';
      const themeBg = localStorage.getItem('themeBg');
      const themeAccent = localStorage.getItem('themeAccent') || '#3b82f6';
      const wallpaper = localStorage.getItem('wallpaper');
      
      document.body.classList.remove('light-mode', 'dark-mode');
      
      if (mode === 'light') {
        document.body.classList.add('light-mode');
      } else if (mode === 'system') {
        if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.body.classList.add('light-mode');
        } else {
          document.body.classList.add('dark-mode');
        }
      } else {
        document.body.classList.add('dark-mode');
      }
      
      document.documentElement.style.setProperty('--accent-color', themeAccent);
      
      // Застосовуємо фон з налаштувань браузера (якщо є)
      if (themeBg) {
        document.body.style.backgroundColor = themeBg;
      }
      
      // Застосовуємо шпалери
      if (wallpaper && wallpaper !== 'none') {
        if (wallpaper.startsWith('data:') || wallpaper.startsWith('http')) {
          // Кастомна картинка
          document.body.style.backgroundImage = `url(${wallpaper})`;
        } else {
          // Градієнтні пресети - потрібно знайти відповідний градієнт
          const wallpaperGradients = {
            'abstract1': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            'abstract2': 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'abstract3': 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'abstract4': 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'abstract5': 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'abstract6': 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)'
          };
          
          if (wallpaperGradients[wallpaper]) {
            document.body.style.backgroundImage = wallpaperGradients[wallpaper];
          }
        }
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.classList.add('has-wallpaper');
      } else {
        document.body.style.backgroundImage = 'none';
        document.body.classList.remove('has-wallpaper');
      }
    }
    
    loadTheme();

    // Слухаємо зміни теми
    window.addEventListener('storage', (e) => {
      if (e.key === 'themeMode' || e.key === 'themeBg' || e.key === 'themeAccent' || e.key === 'wallpaper') {
        loadTheme();
      }
    });
  </script>

  <!-- ============================================
       NEWS FEED SIDEBAR - Стрічка новин
       ============================================ -->
  
  <!-- News Feed Sidebar -->
  <div id="news-sidebar" class="news-sidebar collapsed">
    <div class="news-header">
      <div class="news-title">News</div>
      <div class="news-subtitle">
        AI Feed <span class="news-badge" id="news-stats">0 articles</span>
      </div>
      <button id="toggle-news-sidebar" title="Сховати панель">◀</button>
    </div>
    
    <div id="news-feed-container" class="news-feed-container">
      <div class="news-empty-state">
        <div class="news-empty-icon">📰</div>
        <div class="news-empty-text">
          Натисни кнопку внизу<br>щоб запустити стрічку
        </div>
      </div>
    </div>
    
    <div class="news-controls">
      <button id="news-start-btn" class="news-control-btn news-btn-start">
        ▶ Start
      </button>
      <button id="news-stop-btn" class="news-control-btn news-btn-stop" style="display: none;">
        ⏸ Stop
      </button>
    </div>
  </div>

  <!-- Floating Action Button (FAB) для відкриття стрічки новин -->
  <button id="news-fab" class="news-fab" title="Відкрити стрічку новин">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
    </svg>
  </button>

  <!-- Feed Overlay (iframe) -->
  <div id="feed-overlay" class="feed-overlay" style="display: none;">
    <iframe id="feed-iframe" src="feed.html" frameborder="0"></iframe>
  </div>

  <script>
    // ============================================
    // NEWS FEED LOGIC - Логіка стрічки новин
    // ============================================
    
    const newsSidebar = document.getElementById('news-sidebar');
    const newsFab = document.getElementById('news-fab');
    const toggleNewsSidebarBtn = document.getElementById('toggle-news-sidebar');
    const newsStartBtn = document.getElementById('news-start-btn');
    const newsStopBtn = document.getElementById('news-stop-btn');
    const newsFeedContainer = document.getElementById('news-feed-container');
    const newsStats = document.getElementById('news-stats');
    
    let isNewsSidebarOpen = false;
    let isFeedActive = false;
    let articlesLoaded = 0;

    // Відкриття/закриття news sidebar
    function toggleNewsSidebar() {
      isNewsSidebarOpen = !isNewsSidebarOpen;
      
      if (isNewsSidebarOpen) {
        newsSidebar.classList.add('expanded');
        newsSidebar.classList.remove('collapsed');
      } else {
        newsSidebar.classList.remove('expanded');
        newsSidebar.classList.add('collapsed');
      }
      
      console.log('📰 News sidebar:', isNewsSidebarOpen ? 'opened' : 'closed');
    }

    // FAB кнопка відкриває feed.html як overlay
    if (newsFab) {
      newsFab.addEventListener('click', () => {
        const feedOverlay = document.getElementById('feed-overlay');
        if (feedOverlay) {
          feedOverlay.style.display = 'flex';
        }
      });
    }

    // Кнопка закриття в header sidebar
    if (toggleNewsSidebarBtn) {
      toggleNewsSidebarBtn.addEventListener('click', () => {
        toggleNewsSidebar();
      });
    }

    // Оновлення статистики
    function updateNewsStats() {
      if (newsStats) {
        newsStats.textContent = `${articlesLoaded} articles`;
      }
    }

    // Перевіряємо чи є доступ до window.api
    if (typeof window.api !== 'undefined') {
      // Запуск стрічки
      if (newsStartBtn) {
        newsStartBtn.addEventListener('click', async () => {
          try {
            const result = await window.api.startFeed(['all']);
            console.log('🌊 Feed started:', result);
            
            newsStartBtn.style.display = 'none';
            newsStopBtn.style.display = 'flex';
            isFeedActive = true;

            // Очищуємо контейнер при першому запуску
            if (articlesLoaded === 0) {
              newsFeedContainer.innerHTML = '<div class="news-loading">[RELOAD] Loading news...</div>';
            }
          } catch (error) {
            console.error('[ERR] Error starting feed:', error);
          }
        });
      }

      // Зупинка стрічки
      if (newsStopBtn) {
        newsStopBtn.addEventListener('click', async () => {
          try {
            const result = await window.api.stopFeed();
            console.log('🛑 Feed stopped:', result);
            
            newsStopBtn.style.display = 'none';
            newsStartBtn.style.display = 'flex';
            isFeedActive = false;
          } catch (error) {
            console.error('[ERR] Error stopping feed:', error);
          }
        });
      }

      // Отримання нових статей
      window.api.onNewFeedItem((article) => {
        console.log('📰 New article received:', article);
        
        // Видаляємо empty state та loading
        const emptyState = newsFeedContainer.querySelector('.news-empty-state');
        const loading = newsFeedContainer.querySelector('.news-loading');
        if (emptyState) emptyState.remove();
        if (loading) loading.remove();

        articlesLoaded++;
        updateNewsStats();

        // Створюємо картку новини
        const newsItem = document.createElement('div');
        newsItem.className = 'news-item';
        
        newsItem.innerHTML = `
          <div class="news-source">📰 ${escapeHtml(article.source)}</div>
          <div class="news-item-title">${escapeHtml(article.title)}</div>
          <div class="news-summary">${escapeHtml(article.summary)}</div>
        `;
        
        // Клік по картці відкриває статтю у новій вкладці
        newsItem.addEventListener('click', async () => {
          if (window.api && window.api.openInBrowser) {
            await window.api.openInBrowser(article.url);
          } else {
            window.open(article.url, '_blank');
          }
        });
        
        // Додаємо на початок (найновіше зверху)
        newsFeedContainer.prepend(newsItem);
      });

      // Повідомлення про пропуск (timeout)
      window.api.onFeedSkip((source) => {
        console.log('[TIME] Article skipped from:', source);
        
        const notice = document.createElement('div');
        notice.className = 'news-skip';
        notice.textContent = `[TIME] Skipped from ${source}`;
        
        newsFeedContainer.prepend(notice);

        // Автоматично видаляємо через 3 секунди
        setTimeout(() => {
          notice.style.transition = 'opacity 0.3s ease';
          notice.style.opacity = '0';
          setTimeout(() => notice.remove(), 300);
        }, 3000);
      });

      console.log('[OK] News Feed initialized on newtab');
    } else {
      console.warn('[WARN] window.api not available. News feed will not work.');
    }

    // Функція для безпечного відображення HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

  <!-- Speed Dial Module -->
  <script src="js/speed-dial.js"></script>
</body>
</html>
