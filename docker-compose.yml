version: '3.8'

services:
  browserx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browserx
    image: browserx:latest
    ports:
      - "5900:5900"
    environment:
      - DISPLAY=:99
      - NODE_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - tor-data:/app/bin/tor/data
      - app-data:/root/.config/BrowserX
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: '2gb'
volumes:
  tor-data:
    driver: local
  app-data:
    driver: local
networks:
  default:
    name: browserx-network
