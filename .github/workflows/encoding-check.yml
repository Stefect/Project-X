name: Encoding Check

on:
  pull_request:
  push:
    branches:
      - main
      - feature/dev

jobs:
  check-encoding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run encoding guard
        run: npm run check:encoding

      - name: Run tests
        run: npm test
